name: CI

on:
  pull_request:
    branches: [main, mvp]
  push:
    branches: [main, mvp]

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      # Public placeholders let builds compile without connecting to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Clean up leftover local Supabase containers
        run: npx supabase stop --no-backup || true

      - name: Start disposable local database and replay migrations
        id: db_start
        run: npm run db:start

      - name: Diagnose local database startup failure
        if: ${{ failure() && steps.db_start.outcome == 'failure' }}
        run: |
          docker ps -a || true
          docker network ls || true
          sudo ss -ltnp | grep -E ':(54321|54322|54323|54324|54327)\b' || true

      - name: Run automated tests
        run: npm test

      - name: Verify populated POC upgrade and fresh replay
        run: npm run test:db:upgrade

      - name: Verify generated database types
        run: npm run db:types:check

      - name: Lint database functions
        run: npx supabase db lint --local --schema public --fail-on error

      - name: Verify synthetic local seed
        run: npm run test:local-seed

      - name: Build for production
        run: npm run build

      - name: Stop disposable database
        if: always()
        run: npx supabase stop --no-backup || true
