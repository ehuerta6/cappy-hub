name: CI

on:
  pull_request:
    branches: [main, mvp]
  push:
    branches: [main, mvp]

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect existing migrations from changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migration-immutability.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Clean up leftover local Supabase containers
        run: npx supabase stop --no-backup || true

      - name: Start disposable local database and replay migrations
        id: db_start
        run: npm run db:start

      - name: Diagnose local database startup failure
        if: ${{ failure() && steps.db_start.outcome == 'failure' }}
        run: |
          docker ps -a || true
          docker network ls || true
          sudo ss -ltnp | grep -E ':(54321|54322|54323|54324|54327)\b' || true

      - name: Run automated tests
        run: npm test

      - name: Verify populated POC upgrade and fresh replay
        run: npm run test:db:upgrade

      - name: Verify generated database types
        run: npm run db:types:check

      - name: Lint database functions
        run: npx supabase db lint --local --schema public --fail-on error

      - name: Verify synthetic local seed
        run: npm run test:local-seed

      - name: Prepare the full local app and seeded auth accounts
        run: npm run local:reset

      - name: Build for production
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        id: browser_smoke
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: ${{ failure() && steps.browser_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop disposable database
        if: always()
        run: npx supabase stop --no-backup || true
