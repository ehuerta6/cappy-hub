name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that this commit is still current main
        id: current-main
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-production-main-tip.mjs

      - name: Install locked dependencies
        if: steps.current-main.outputs.is_current == 'true'
        run: npm ci

      - name: Validate immutable Vercel deployment configuration
        if: steps.current-main.outputs.is_current == 'true'
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if [[ -z "$VERCEL_ACCESS_TOKEN" || -z "$VERCEL_PROJECT_ID" || -z "$VERCEL_REPOSITORY_ID" ]]; then
            echo "Required immutable Vercel deployment configuration is missing."
            exit 1
          fi

      - name: Verify Vercel production domains are staged before deployment
        if: steps.current-main.outputs.is_current == 'true'
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/deploy-vercel-production.mjs --check-project

      - name: Verify production migration history before push
        if: steps.current-main.outputs.is_current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/verify-production-migrations.mjs

      - name: Preview pending production migrations
        if: steps.current-main.outputs.is_current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply production migrations
        if: steps.current-main.outputs.is_current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify production migration history is aligned
        if: steps.current-main.outputs.is_current == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/verify-production-migrations.mjs --require-aligned

      - name: Recheck main before production deployment
        id: latest-main
        if: steps.current-main.outputs.is_current == 'true'
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-production-main-tip.mjs

      - name: Stage, verify, and promote the immutable Vercel production deployment
        id: production-deployment
        if: >-
          steps.current-main.outputs.is_current == 'true' &&
          steps.latest-main.outputs.is_current == 'true'
        timeout-minutes: 11
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/deploy-vercel-production.mjs

      - name: Wait for production deployment and verify login surface
        if: ${{ !cancelled() &&
          steps.current-main.outputs.is_current == 'true' &&
          steps.latest-main.outputs.is_current == 'true' &&
          steps.production-deployment.outcome != 'skipped' }}
        timeout-minutes: 11
        env:
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-production-deployment.mjs
